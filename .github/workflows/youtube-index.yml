name: Update YouTube index

# Scans the SMO Randomizer Logic channel and writes assets/youtube-index.json
# (every upload's id + title). The site reads that file to find videos and
# show the "has video" badges - no manual updating.
on:
  schedule:
    - cron: "0 * * * *"      # every hour
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    paths: [".github/workflows/youtube-index.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch channel uploads
        run: |
          pip install yt-dlp
          yt-dlp --flat-playlist --dump-single-json "https://www.youtube.com/@SMORandomizerLogic/videos" > raw.json || echo "{}" > raw.json
          curl -sL "https://www.youtube.com/feeds/videos.xml?channel_id=UCN3jvHO5bS9PoEopGKsi0bg" > feed.xml || true
      - name: Build index
        run: |
          python - <<'PY'
          import json, re, os, html
          path = "assets/youtube-index.json"
          vids = {}
          try:
              for v in json.load(open(path)): vids[v["id"]] = v["title"]
          except Exception: pass
          try:
              for e in (json.load(open("raw.json")).get("entries") or []):
                  if e and e.get("id") and e.get("title"): vids[e["id"]] = e["title"]
          except Exception: pass
          try:
              xml = open("feed.xml", encoding="utf-8").read()
              for m in re.finditer(r"<entry>.*?<yt:videoId>(.*?)</yt:videoId>.*?<title>(.*?)</title>", xml, re.S):
                  vids[m.group(1)] = html.unescape(m.group(2))
          except Exception: pass
          out = [{"id": i, "title": t} for i, t in sorted(vids.items(), key=lambda x: x[1].lower())]
          os.makedirs("assets", exist_ok=True)
          json.dump(out, open(path, "w", encoding="utf-8"), indent=1, ensure_ascii=False)
          print(len(out), "videos")
          PY
          rm -f raw.json feed.xml
      - name: Commit if changed
        run: |
          git config user.name "youtube-index-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/youtube-index.json
          git diff --cached --quiet || (git commit -m "Update YouTube index" && git push)
