// A checkpoint entry is a "Loading Zone" (kingdom-transition point, styled
// green per the reference) when its underlying node is a custom_place, i.e.
// a hand-tagged transition/enter-exit point rather than an in-kingdom
// checkpoint marker. Everything else renders as a regular gold checkpoint.
function buildCheckpointGroup(checkpointName, entry){
  const isLoadingZone = entry.type === "custom_place";

  const group = document.createElement("div");
  group.className = "checkpoint-group" + (isLoadingZone ? " loading-zone" : "");
  group.dataset.checkpointName = checkpointName;

  const header = document.createElement("button");
  header.type = "button";
  header.className = "checkpoint-group-header";

  if(checkpointName !== "Other / No Checkpoint"){
    const icon = document.createElement("img");
    icon.className = "checkpoint-group-icon";
    icon.src = isLoadingZone ? "icon/customnode.png" : "icon/infocheckpoint.png";
    icon.alt = "";
    icon.onerror = function(){ this.style.display = "none"; };
    icon.title = "Click for this location's own requirements";
    // Opens the node-inspect popup for this checkpoint/custom node instead
    // of toggling the group — stopPropagation keeps the header's own
    // open/close click handler (added below) from also firing.
    icon.addEventListener("click", (e) => {
      e.stopPropagation();
      const firstMoon = entry.moons && entry.moons[0];
      openNodeInfo({
        kind: isLoadingZone ? "custom_place" : "checkpoint",
        kingdom: firstMoon ? firstMoon.kingdom : KINGDOM_ORDER[currentKingdomIndex],
        nodeId: firstMoon ? firstMoon.checkpointNodeId : null,
        fallbackName: checkpointName.replace(/\s*Checkpoint\s*$/i, ""),
      });
    });
    header.appendChild(icon);
  }

  const nameEl = document.createElement("span");
  nameEl.className = "checkpoint-group-name";
  nameEl.textContent = checkpointName.replace(/\s*Checkpoint\s*$/i, "");
  header.appendChild(nameEl);

  const chevron = document.createElement("span");
  chevron.className = "checkpoint-group-chevron";
  chevron.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  header.appendChild(chevron);

  group.appendChild(header);

  const subStages = GROUP_SUBAREA_SUMMARIES[checkpointName.replace(/\s*Checkpoint\s*$/i, "")];
  if(subStages){
    const kName = (entry.moons && entry.moons[0]) ? entry.moons[0].kingdom : KINGDOM_ORDER[currentKingdomIndex];
    const data = KINGDOM_NODE_DATA[kName];
    subStages.forEach(st => {
      const trav = computeRoomTraversal(kName, st);
      const node = data && data.nodes.find(n => n.stage === st);
      if(!trav || !node) return;
      const box = document.createElement("div");
      box.className = "group-subarea-summary";
      const t = document.createElement("div");
      t.className = "group-subarea-title";
      t.textContent = node.stage_display_name;
      box.appendChild(t);
      box.appendChild(renderEntranceReqs(trav));
      group.appendChild(box);
    });
  }

  const body = document.createElement("div");
  body.className = "checkpoint-group-body";
  entry.moons.forEach(moon => body.appendChild(buildMoonPanel(moon)));
  group.appendChild(body);

  header.addEventListener("click", () => {
    group.classList.toggle("open");
    if(group.classList.contains("open")) measureOptionsCollapsiblesIn(group);
  });

  return group;
}

function renderCheckpointGroups(moons){
  const container = document.getElementById("checkpointGroups");
  container.innerHTML = "";

  if(moons.length === 0){
    const empty = document.createElement("div");
    empty.className = "checkpoint-empty";
    empty.textContent = "No moons left to show with this filter.";
    container.appendChild(empty);
    return;
  }

  const groups = groupMoonsByCheckpoint(moons);
  groups.forEach(([checkpointName, entry]) => {
    container.appendChild(buildCheckpointGroup(checkpointName, entry));
  });
  // Open the first group by default so the view isn't a wall of collapsed bars.
  const first = container.querySelector(".checkpoint-group");
  if(first) first.classList.add("open");
}

let currentKingdomIndex = 0;
// "UNMARKED (Bug Fixing)" mode: when on, the grid for the *current* kingdom
// only shows moons with at least one un-tagged ("unrated") difficulty lane.
// Navigating to a different kingdom (prev/next/dot) always clears it, and
// clicking the button itself toggles it — both handled below.
let unmarkedMode = false;

// Glitched-logic filter cycles through three states on the current kingdom:
// "all" (default) -> "hide" (no Glitched-lane moons) -> "only" (only
// Glitched-lane moons) -> back to "all". Same reset-on-navigate rule as
// unmarkedMode.
const GLITCH_MODES = ["all", "hide", "only"];
const GLITCH_LABELS = { all: "Glitched: All", hide: "Glitched: Hidden", only: "Glitched: Only" };
let glitchMode = "all";

// Renders the grid for whatever kingdom/unmarkedMode is currently active,
// without touching the pager name/icon/dots. Used by both kingdom
// navigation and the UNMARKED toggle.
let viewMode = "moon"; // "moon" | "checkpoint" — persists across kingdom navigation

/* =========================================================
   ABILITY / CAPTURE FILTERS
   Two independent multi-select sets of tokens, but combined as one
   pool: a moon passes if ANY selected token — ability or capture —
   appears anywhere in its requirements (any OR-branch, any AND-slot).
   An empty set for a filter means that filter is off; if both are
   empty, no filtering happens. Free moons (no requirements at all)
   always pass, since there's nothing on them to match against.
   ========================================================= */
let selectedAbilities = new Set();
let selectedCaptures = new Set();

function moonTokens(moon){
  const set = new Set();
  (moon.orGroups || []).forEach(group => group.forEach(tok => {
    set.add(tok);
    // A branch requiring the raw Turnip/Nut/Seed token also counts as
    // requiring "Grab" for filtering purposes, since that's the only
    // option the player actually sees in the picker (see
    // ABILITY_FILTER_FOLD_TOKENS).
    if(ABILITY_FILTER_FOLD_TOKENS[tok]) set.add(ABILITY_FILTER_FOLD_TOKENS[tok]);
  }));
  return set;
}

function moonMatchesFilters(moon){
  if(selectedAbilities.size === 0 && selectedCaptures.size === 0) return true;
  const groups = moon.orGroups || [];
  // Free moons have no requirements to match against, so they always pass
  // through an active filter rather than being excluded by it.
  if(groups.length === 0) return true;
  // A branch made up entirely of always-unlocked ("optional") tokens gets
  // stripped down to an empty group during parsing (see the
  // ALWAYS_UNLOCKED_TOKENS check in parseMoon) — it's a fully free route
  // that doesn't require unlocking anything. If ANY branch is like this,
  // the moon is gettable with nothing selected at all, so it should never
  // be hidden by an ability/capture filter — same treatment as a moon with
  // zero groups. This is what was hiding e.g. Swim-only moons whenever any
  // other filter chip was active.
  if(groups.some(group => group.length === 0)) return true;
  const toks = moonTokens(moon);
  let any = false;
  selectedAbilities.forEach(t => { if(toks.has(t)) any = true; });
  selectedCaptures.forEach(t => { if(toks.has(t)) any = true; });
  return any;
}

function renderGrid(){
  const name = KINGDOM_ORDER[currentKingdomIndex];
  const grid = document.getElementById("grid");
  const checkpointGroups = document.getElementById("checkpointGroups");
  const emptyState = document.getElementById("emptyState");
  grid.innerHTML = "";

  let moons = KINGDOMS[name] || [];
  if(unmarkedMode) moons = moons.filter(isMoonUnmarked);
  if(glitchMode === "hide") moons = moons.filter(m => !hasGlitchedLane(m));
  else if(glitchMode === "only") moons = moons.filter(hasGlitchedLane);
  const tokenFiltering = selectedAbilities.size > 0 || selectedCaptures.size > 0;
  if(tokenFiltering) moons = moons.filter(moonMatchesFilters);

  const filtering = unmarkedMode || glitchMode !== "all" || tokenFiltering;

  if(filtering && moons.length === 0){
    grid.style.display = "none";
    checkpointGroups.style.display = "none";
    emptyState.style.display = "block";
    if(unmarkedMode){
      emptyState.textContent = "No Marked Moons! This kingdom has fully completed levels of Logic for All Moons!";
    } else if(glitchMode === "only"){
      emptyState.textContent = "No Glitched-logic moons in this kingdom!";
    } else if(tokenFiltering){
      emptyState.textContent = "No moons in this kingdom match the selected Ability/Capture filters.";
    } else {
      emptyState.textContent = "No moons left to show with this filter.";
    }
    return;
  }

  emptyState.style.display = "none";
  if(viewMode === "checkpoint"){
    grid.style.display = "none";
    checkpointGroups.style.display = "flex";
    renderCheckpointGroups(moons);
  } else {
    grid.style.display = "";
    checkpointGroups.style.display = "none";
    moons.forEach(moon => grid.appendChild(buildMoonCard(moon)));
    measureOptionsCollapsiblesIn(grid);
  }
  applyFilterMatchHighlight();
}

// Adds a gold ring to any requirement icon on-screen whose token is
// currently selected in either filter, so it's visually obvious *why*
// a moon matched (mirrors the reference screenshot's blue-ring emphasis
// on the matching Ability/Capture icons inside each moon's chips).
function applyFilterMatchHighlight(){
  if(selectedAbilities.size === 0 && selectedCaptures.size === 0) return;
  document.querySelectorAll(".icon-wrap[data-token]").forEach(el => {
    const tok = el.dataset.token;
    // A Turnip/Nut/Seed chip still shows its own real display_name/icon
    // (per FILTER_LABEL_OVERRIDES' comment above), but it should still
    // ring gold when "Grab" is the active filter, since that's the
    // option the player actually selected to reach it.
    const foldedTok = ABILITY_FILTER_FOLD_TOKENS[tok] || tok;
    if(selectedAbilities.has(tok) || selectedCaptures.has(tok)
      || selectedAbilities.has(foldedTok) || selectedCaptures.has(foldedTok)){
      el.classList.add("filter-match");
    }
  });
}

function renderKingdom(name){
  unmarkedMode = false;
  const unmarkedBtn = document.getElementById("unmarkedToggle");
  if(unmarkedBtn) unmarkedBtn.classList.remove("active");

  glitchMode = "all";
  const glitchBtn = document.getElementById("glitchToggle");
  if(glitchBtn){
    glitchBtn.classList.remove("active");
    document.getElementById("glitchToggleLabel").textContent = GLITCH_LABELS.all;
  }

  currentKingdomIndex = KINGDOM_ORDER.indexOf(name);
  renderGrid();

  const nameEl = document.getElementById("pagerName");
  if(nameEl) nameEl.textContent = name;

  const iconEl = document.getElementById("pagerKingdomIcon");
  if(iconEl){
    iconEl.innerHTML = "";
    iconEl.appendChild(makeKingdomIcon(name));
  }

  document.querySelectorAll(".pager-dot").forEach(dot=>{
    dot.classList.toggle("active", dot.dataset.kingdom === name);
  });
}

function rebuildKingdomTabs(){
  KINGDOM_ORDER = sortKingdomNames(KINGDOM_ORDER);
  const dots = document.getElementById("pagerDots");
  dots.innerHTML = "";
  KINGDOM_ORDER.forEach(name => {
    const dot = document.createElement("button");
    dot.className = "pager-dot";
    dot.dataset.kingdom = name;
    dot.title = name;
    dot.setAttribute("aria-label", name);
    dot.onclick = () => renderKingdom(name);
    dots.appendChild(dot);
  });
}

function goToRelativeKingdom(delta){
  if(KINGDOM_ORDER.length === 0) return;
  const next = (currentKingdomIndex + delta + KINGDOM_ORDER.length) % KINGDOM_ORDER.length;
  renderKingdom(KINGDOM_ORDER[next]);
}

document.getElementById("pagerPrev").onclick = () => goToRelativeKingdom(-1);
document.getElementById("pagerNext").onclick = () => goToRelativeKingdom(1);

document.getElementById("unmarkedToggle").addEventListener("click", () => {
  unmarkedMode = !unmarkedMode;
  document.getElementById("unmarkedToggle").classList.toggle("active", unmarkedMode);
  renderGrid();
});

document.getElementById("glitchToggle").addEventListener("click", () => {
  const idx = GLITCH_MODES.indexOf(glitchMode);
  glitchMode = GLITCH_MODES[(idx + 1) % GLITCH_MODES.length];
  const btn = document.getElementById("glitchToggle");
  btn.classList.toggle("active", glitchMode !== "all");
  document.getElementById("glitchToggleLabel").textContent = GLITCH_LABELS[glitchMode];
  renderGrid();
});

document.getElementById("viewModeToggle").addEventListener("click", () => {
  viewMode = viewMode === "moon" ? "checkpoint" : "moon";
  const btn = document.getElementById("viewModeToggle");
  btn.classList.toggle("active", viewMode === "checkpoint");
  document.getElementById("viewModeToggleLabel").textContent = viewMode === "checkpoint" ? "By Node" : "By Moon";
  renderGrid();
});

/* =========================================================
   ABILITY / CAPTURE FILTER BARS — UI wiring
   Each bar (Ability, Capture) collapses to a row of selected-item
   chips + a red clear (X); clicking the row (outside the X) opens a
   full picker grid of every token of that kind, built from
   buildFilterLists() so it always reflects real loaded data, in the
   order tokens were first encountered across the (story-ordered)
   kingdom files.
   ========================================================= */
function makeFilterIconEl(token, sizeClass){
  const info = ICON_MANIFEST[token];
  const label = filterLabelFor(token);
  const wrap = document.createElement("div");
  wrap.className = sizeClass;
  if(!info){
    const fb = document.createElement("div");
    fb.className = "icon-fallback";
    fb.textContent = "?";
    wrap.appendChild(fb);
    return wrap;
  }
  const img = document.createElement("img");
  let attempt = 0;
  img.src = "icon/" + info.filenames[attempt];
  img.alt = label;
  img.onerror = function(){
    attempt++;
    if(attempt < info.filenames.length){ img.src = "icon/" + info.filenames[attempt]; return; }
    const fb = document.createElement("div");
    fb.className = "icon-fallback";
    fb.style.setProperty("--icon-color", info.color || "#34406e");
    fb.textContent = initialsFor(label);
    img.replaceWith(fb);
  };
  wrap.appendChild(img);
  return wrap;
}

// Movement Ability dial tokens confirmed against sAbilities[] — all of
// them (including Jaxi/Bike "Scooter") are now fully wired into the
// filter UI and filtering logic, so none are held back as "not
// implemented" any more. Left as an empty map (rather than deleting the
// mechanism outright) so a future dial token can still be greyed out
// here the same way, without touching setupFilterBar()/renderOptions().
const NOT_IMPLEMENTED_ABILITY_TOKENS = {};

let notImplementedToastTimer = null;
function showNotImplementedToast(){
  let toast = document.getElementById("notImplementedToast");
  if(!toast){
    toast = document.createElement("div");
    toast.id = "notImplementedToast";
    toast.className = "not-implemented-toast";
    document.body.appendChild(toast);
  }
  toast.textContent = "Not Implemented Yet";
  toast.classList.add("show");
  clearTimeout(notImplementedToastTimer);
  notImplementedToastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
}

function setupFilterBar(kind, tokens, selectedSet){
  const barEl = document.getElementById(kind + "FilterBar");
  const rowEl = document.getElementById(kind + "FilterRow");
  const chipsEl = document.getElementById(kind + "FilterChips");
  const clearBtn = document.getElementById(kind + "FilterClear");
  const panelEl = document.getElementById(kind + "FilterPanel");
  const searchEl = document.getElementById(kind + "FilterSearch");
  const gridEl = document.getElementById(kind + "FilterGrid");

  function renderChips(){
    chipsEl.innerHTML = "";
    if(selectedSet.size === 0){
      const empty = document.createElement("span");
      empty.className = "filter-bar-empty";
      empty.textContent = "Any " + (kind === "ability" ? "Ability" : "Capture");
      chipsEl.appendChild(empty);
      clearBtn.style.display = "none";
      return;
    }
    tokens.forEach(token => {
      if(!selectedSet.has(token)) return;
      chipsEl.appendChild(makeFilterIconEl(token, "filter-bar-chip"));
    });
    clearBtn.style.display = "";
  }

  function renderOptions(query){
    const q = (query || "").trim().toLowerCase();
    gridEl.innerHTML = "";
    const matches = tokens.filter(token => {
      const label = filterLabelFor(token);
      return !q || label.toLowerCase().includes(q);
    });
    if(matches.length === 0){
      const none = document.createElement("div");
      none.className = "filter-bar-none";
      none.textContent = "No matches.";
      gridEl.appendChild(none);
      return;
    }
    matches.forEach(token => {
      const label = filterLabelFor(token);
      const notImplemented = kind === "ability" && NOT_IMPLEMENTED_ABILITY_TOKENS[token];
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "filter-option"
        + (selectedSet.has(token) ? " selected" : "")
        + (notImplemented ? " not-implemented" : "");
      const iconWrap = document.createElement("div");
      iconWrap.className = "filter-option-icon";
      iconWrap.appendChild(makeFilterIconEl(token, ""));
      btn.appendChild(iconWrap);
      const nameEl = document.createElement("span");
      nameEl.className = "filter-option-name";
      nameEl.textContent = label;
      btn.appendChild(nameEl);
      if(notImplemented){
        btn.title = "Not Implemented Yet";
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          showNotImplementedToast();
        });
      } else {
        btn.addEventListener("click", () => {
          if(selectedSet.has(token)) selectedSet.delete(token);
          else selectedSet.add(token);
          btn.classList.toggle("selected", selectedSet.has(token));
          renderChips();
          renderGrid();
        });
      }
      gridEl.appendChild(btn);
    });
  }

  rowEl.addEventListener("click", (e) => {
    if(e.target === clearBtn) return;
    barEl.classList.toggle("open");
    if(barEl.classList.contains("open")) renderOptions(searchEl.value);
  });
  clearBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    selectedSet.clear();
    renderChips();
    if(barEl.classList.contains("open")) renderOptions(searchEl.value);
    renderGrid();
  });
  searchEl.addEventListener("input", () => renderOptions(searchEl.value));
  searchEl.addEventListener("click", (e) => e.stopPropagation());

  renderChips();
}

let filterBarsInitialized = false;
function initFilterBars(){
  const { abilities, captures } = buildFilterLists();
  setupFilterBar("ability", abilities, selectedAbilities);
  setupFilterBar("capture", captures, selectedCaptures);
  filterBarsInitialized = true;
}

/* =========================================================
   MOON SEARCH — flat index across every loaded kingdom, built
   once all kingdom files have loaded. Typing filters live; each
   result shows the moon's kingdom-access icon; clicking one jumps
   to that kingdom's page, scrolls to the card, and pops it.
   ========================================================= */
let MOON_SEARCH_INDEX = [];
function buildSearchIndex(){
  MOON_SEARCH_INDEX = [];
  KINGDOM_ORDER.forEach(kingdom => {
    (KINGDOMS[kingdom] || []).forEach(moon => {
      MOON_SEARCH_INDEX.push({ name: moon.name, kingdom });
    });
  });
}

const searchOverlay = document.getElementById("searchOverlay");
const searchInput = document.getElementById("searchInput");
const searchResultsEl = document.getElementById("searchResults");

function openSearch(){
  if(MOON_SEARCH_INDEX.length === 0) return;
  searchOverlay.classList.add("open");
  searchInput.value = "";
  renderSearchResults("");
  setTimeout(() => searchInput.focus(), 0);
}
function closeSearch(){
  searchOverlay.classList.remove("open");
}

function renderSearchResults(query){
  const q = query.trim().toLowerCase();
  searchResultsEl.innerHTML = "";

  if(q === ""){
    const prompt = document.createElement("div");
    prompt.className = "search-prompt";
    prompt.innerHTML = '<span class="icon-svg" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>Start typing a moon\'s name…';
    searchResultsEl.appendChild(prompt);
    return;
  }

  const matches = MOON_SEARCH_INDEX.filter(m => m.name.toLowerCase().includes(q));

  if(matches.length === 0){
    const empty = document.createElement("div");
    empty.className = "search-empty";
    empty.textContent = 'No moons match "' + query + '".';
    searchResultsEl.appendChild(empty);
    return;
  }

  matches.slice(0, 100).forEach(m => {
    const row = document.createElement("div");
    row.className = "search-result";
    row.tabIndex = 0;

    const iconWrap = document.createElement("span");
    iconWrap.className = "search-result-icon";
    iconWrap.appendChild(makeKingdomIcon(m.kingdom));
    row.appendChild(iconWrap);

    const textWrap = document.createElement("span");
    textWrap.className = "search-result-text";
    const nameEl = document.createElement("span");
    nameEl.className = "search-result-name";
    nameEl.textContent = m.name;
    const kingdomEl = document.createElement("span");
    kingdomEl.className = "search-result-kingdom";
    kingdomEl.textContent = m.kingdom;
    textWrap.appendChild(nameEl);
    textWrap.appendChild(kingdomEl);
    row.appendChild(textWrap);

    row.addEventListener("click", () => goToMoon(m.kingdom, m.name));
    row.addEventListener("keydown", (e) => { if(e.key === "Enter") goToMoon(m.kingdom, m.name); });

    searchResultsEl.appendChild(row);
  });
}

function goToMoon(kingdomName, moonName){
  closeSearch();
  renderKingdom(kingdomName);
  requestAnimationFrame(() => {
    const escaped = window.CSS && CSS.escape ? CSS.escape(moonName) : moonName.replace(/["\\]/g, "\\$&");

    if(viewMode === "checkpoint"){
      // In checkpoint view the target is a collapsed moon-panel nested inside
      // a collapsed checkpoint-group — open both ancestors before scrolling,
      // or the highlight would pop on an invisible (display:none) element.
      const panel = document.querySelector('.moon-panel[data-moon-name="' + escaped + '"]');
      if(!panel) return;
      const group = panel.closest(".checkpoint-group");
      if(group) group.classList.add("open");
      panel.classList.add("open");
      measureOptionsCollapsiblesIn(panel);
      panel.scrollIntoView({ behavior: "smooth", block: "center" });
      setTimeout(() => {
        panel.classList.add("pop-highlight");
        panel.addEventListener("animationend", () => panel.classList.remove("pop-highlight"), { once: true });
      }, 350);
      return;
    }

    const card = document.querySelector('.moon-card[data-moon-name="' + escaped + '"]');
    if(!card) return;
    card.scrollIntoView({ behavior: "smooth", block: "center" });
    // Give the smooth scroll a moment to arrive before popping, so the
    // animation reads as "found it!" rather than happening off-screen.
    setTimeout(() => {
      card.classList.add("pop-highlight");
      card.addEventListener("animationend", () => card.classList.remove("pop-highlight"), { once: true });
    }, 350);
  });
}

document.getElementById("searchToggle").addEventListener("click", openSearch);
document.getElementById("searchClose").addEventListener("click", closeSearch);
searchOverlay.addEventListener("click", (e) => { if(e.target === searchOverlay) closeSearch(); });
document.addEventListener("keydown", (e) => {
  if(e.key === "Escape" && searchOverlay.classList.contains("open")) closeSearch();
});
searchInput.addEventListener("input", () => renderSearchResults(searchInput.value));

/* =========================================================
   NODE-INSPECT POPUP — clicking a Subarea/Checkpoint/Custom-Node icon
   (on a moon card, a moon panel, or a checkpoint-group header) opens
   this: what does it actually cost to reach THIS specific location,
   broken out by logic level (Casual/Advanced/Expert/Glitched), sourced
   from buildNodeReachIndex's per-node branch data. A Subarea shows
   EVERY one of its entrances side by side (a subarea can have more than
   one way in, each with its own cost — e.g. Freezing Waterway's near
   entrance is Free, its far entrance needs Hosui) instead of collapsing
   to a single answer that only ever reflected whichever entrance a
   given moon happened to be tagged from.
   ========================================================= */
const nodeOverlay = document.getElementById("nodeOverlay");
const nodeModalBody = document.getElementById("nodeModalBody");
const nodeModalClose = document.getElementById("nodeModalClose");

// Turns a flat list of reach branches (one per viable inbound edge
// OR-branch, each already tagged with its own tier — see
// buildNodeReachIndex) into the same { tier, label, groups } lane shape
// buildMovementOptions/parseMoon use, so rendering code doesn't need two
// different data shapes for "a moon's requirements" vs. "a node's reach
// requirements". Returns null (meaning: free, nothing to fold in) when
// there are no branches at all.
function buildTierLanesFromBranches(branches){
  if(!branches || branches.length === 0) return null;
  const tierLanes = [];
  TIER_ORDER.forEach(tierKey => {
    const groups = branches
      .filter(b => b.tier === tierKey)
      .map(b => Object.assign(b.group.slice(), { scenarios: b.scenarios }));
    if(groups.length) tierLanes.push({ tier: tierKey, label: TIER_LABEL[tierKey], groups });
  });
  return tierLanes.length ? tierLanes : null;
}

// Renders tier lanes read-only (no click-to-video handlers — this popup
// can already be opened from on top of the checkpoint-group view, and
// these chips describe a *node's* reach cost, not a specific moon's
// clickable requirement branch, so they shouldn't try to look up a
// logic-clip video at all). Deliberately reuses the exact same
// .tier-stack/.tier-lane/.tier-pill/.option-chip classes the moon cards
// use, so it looks native without any popup-specific CSS for the chips
// themselves.
function renderReachTierLanes(tierLanes, disableCollapse){
  const stack = document.createElement("div");
  stack.className = "tier-stack";
  tierLanes.forEach(lane => {
    const laneEl = document.createElement("div");
    laneEl.className = "tier-lane " + lane.tier;

    const pill = document.createElement("span");
    pill.className = "tier-pill";
    pill.textContent = lane.label;
    laneEl.appendChild(pill);

    const optsEl = document.createElement("div");
    optsEl.className = "tier-options";
    lane.groups.forEach((andGroup, i) => {
      if(i > 0){
        const sep = document.createElement("span");
        sep.className = "or-sep " + lane.tier;
        sep.textContent = "or";
        optsEl.appendChild(sep);
      }
      const chip = document.createElement("div");
      if(andGroup.length === 0){
        chip.className = "option-chip free-chip";
        chip.textContent = "Free";
      } else {
        chip.className = "option-chip";
        sortedTokensForDisplay(andGroup).forEach((token, j) => {
          if(j > 0){
            const plus = document.createElement("span");
            plus.className = "and-plus";
            plus.textContent = "+";
            chip.appendChild(plus);
          }
          chip.appendChild(makeIcon(token));
        });
      }
      const scenarioLabel = andGroup.scenarios ? scenarioListLabel(andGroup.scenarios) : null;
      if(scenarioLabel){
        const tag = document.createElement("span");
        tag.className = "scenario-tag";
        tag.textContent = scenarioLabel;
        chip.appendChild(tag);
      }
      optsEl.appendChild(chip);
    });

    laneEl.appendChild(optsEl);
    stack.appendChild(laneEl);
  });
  const totalOptions = tierLanes.reduce((sum, lane) => sum + lane.groups.length, 0);
  return wrapOptionsIfCollapsible(stack, totalOptions, disableCollapse);
}

// Appends either a tiered requirement stack or a plain "Free" tag to
// `parent`, for the given reach branches — the one bit of rendering
// logic shared by every section of the popup (a single node, or one row
// per subarea entrance). disableCollapse is forwarded straight through to
// renderReachTierLanes/wrapOptionsIfCollapsible — see the note there.
function appendReachRequirement(parent, branches, disableCollapse){
  const tierLanes = buildTierLanesFromBranches(branches);
  if(!tierLanes){
    const free = document.createElement("span");
    free.className = "free-tag";
    free.textContent = "Free";
    parent.appendChild(free);
  } else {
    parent.appendChild(renderReachTierLanes(tierLanes, disableCollapse));
  }
}

// Human-friendly label for a substage_entrance node's `side` field
// (sub_near / sub_far) — falls back to its raw display_name for any
// other/legacy side value rather than showing nothing.
function entranceSideLabel(node){
  if(node.side === "sub_near") return "Entrance Pipe";
  if(node.side === "sub_far") return "Exit Pipe";
  return node.display_name || node.entrance_id || "Entrance";
}

// { kind: "subarea" | "checkpoint" | "custom_place", kingdom, stage?,
//   subareaName?, nodeId?, fallbackName? }
function openNodeInfo({ kind, kingdom, stage, subareaName, nodeId, fallbackName, entranceReqs, moonName }){
  const data = KINGDOM_NODE_DATA[kingdom];
  nodeModalBody.innerHTML = "";

  if(kind === "subarea"){
    const title = document.createElement("h3");
    title.className = "node-modal-title";
    title.textContent = subareaName || stage || "Subarea";
    nodeModalBody.appendChild(title);

    const kindTag = document.createElement("div");
    kindTag.className = "node-modal-kind";
    kindTag.textContent = "Subarea";
    nodeModalBody.appendChild(kindTag);

    if(moonName){
      const sub = document.createElement("div");
      sub.className = "node-modal-kind";
      sub.textContent = "For: " + moonName;
      nodeModalBody.appendChild(sub);
    }
    const reqs = entranceReqs || computeRoomTraversal(kingdom, stage);
    if(!reqs){
      const p = document.createElement("p");
      p.className = "node-modal-empty";
      const nEnt = data ? subareaEntrances(data.nodes, stage).length : 0;
      p.textContent = nEnt === 1 ? "This subarea only has one entrance." : "No entrance data available for this subarea yet.";
      nodeModalBody.appendChild(p);
    } else {
      nodeModalBody.appendChild(renderEntranceReqs(reqs, "entrance-reqs in-modal", true));
    }
  } else {
    const node = data ? data.nodeMap[nodeId] : null;
    let displayName = (node && node.display_name) || fallbackName || "Location";
    displayName = displayName.replace(/\s*\([^)]*\)\s*$/, "").replace(/\s*Checkpoint\s*$/i, "");

    const title = document.createElement("h3");
    title.className = "node-modal-title";
    title.textContent = displayName;
    nodeModalBody.appendChild(title);

    const kindTag = document.createElement("div");
    kindTag.className = "node-modal-kind";
    kindTag.textContent = kind === "custom_place" ? "Custom Node" : "Checkpoint";
    nodeModalBody.appendChild(kindTag);

    const block = document.createElement("div");
    block.className = "node-entrance-block";
    appendReachRequirement(block, data && nodeId ? data.reachBranches[nodeId] : null, true);
    nodeModalBody.appendChild(block);
  }

  nodeOverlay.classList.add("open");
  measureOptionsCollapsiblesIn(nodeModalBody);
}

function closeNodeInfo(){
  nodeOverlay.classList.remove("open");
}

nodeModalClose.addEventListener("click", closeNodeInfo);
nodeOverlay.addEventListener("click", (e) => { if(e.target === nodeOverlay) closeNodeInfo(); });
document.addEventListener("keydown", (e) => {
  if(e.key === "Escape" && nodeOverlay.classList.contains("open")) closeNodeInfo();
});

/* =========================================================
   LOGIC VIDEO OVERLAY — clicking a requirement branch ("node") on a
   moon card first silently checks whether a clip exists for it. Only
   once a real file is found does the overlay open: a fancy info box on
   the left (moon name, logic-level pill, that branch's own requirement
   chips) slides + fades in, then the found video/image pops in on the
   right shortly after. If nothing exists yet, the overlay never opens —
   a small toast slides up from the bottom-right of the screen instead,
   entirely separate from the video player.
   ========================================================= */
const videoOverlay = document.getElementById("videoOverlay");
const videoInfoBox = document.getElementById("videoInfoBox");
const videoStage = document.getElementById("videoStage");
const videoClose = document.getElementById("videoClose");
const nothingYetToast = document.getElementById("nothingYetToast");

const TIER_PILL_LABEL = { free: "Free" };

// Guards against a slow check from an earlier click resolving after a
// newer click has already fired — only the most recent request may act.
let videoCheckToken = 0;
let nothingYetTimer = null;

// Cache of baseName -> Promise<boolean> so each clip is only probed once,
// no matter how many times the cards are re-rendered.
const videoExistsCache = new Map();

// Quietly checks whether assets/logicvideos/<baseName>.mp4 (or .webp) exists.
function logicVideoExists(baseName){
  if(videoExistsCache.has(baseName)) return videoExistsCache.get(baseName);
  const p = new Promise(resolve => {
    const v = document.createElement("video");
    v.preload = "metadata";
    v.muted = true;
    v.addEventListener("loadedmetadata", () => { v.removeAttribute("src"); v.load(); resolve(true); }, { once: true });
    v.addEventListener("error", () => {
      const img = new Image();
      img.addEventListener("load", () => resolve(true), { once: true });
      img.addEventListener("error", () => resolve(false), { once: true });
      img.src = "assets/logicvideos/" + baseName + ".webp";
    }, { once: true });
    v.src = "assets/logicvideos/" + baseName + ".mp4";
  });
  videoExistsCache.set(baseName, p);
  return p;
}

// Adds a small play-icon badge to the top-right of a node if it has a clip.
function attachVideoBadge(nodeEl, moon, tierKey, indexInTier){
  logicVideoExists(videoAutoName(moon.name, tierKey, indexInTier)).then(found => {
    if(!found || nodeEl.querySelector(":scope > .has-video-badge")) return;
    const badge = document.createElement("span");
    badge.className = "has-video-badge";
    badge.title = "Has video";
    badge.innerHTML = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 0.5 L9.5 5 L1 9.5 Z" fill="currentColor"/></svg>';
    nodeEl.appendChild(badge);
  });
}

// Entry point for every clickable requirement branch. Checks for a real
// clip first; opens the overlay only if one is found, otherwise pops the
// toast and leaves the overlay untouched.
function handleNodeClick(moon, tierKey, tierLabel, andGroup, indexInTier){
  const baseName = videoAutoName(moon.name, tierKey, indexInTier);
  const myToken = ++videoCheckToken;
  findLogicVideo(baseName, (mediaEl) => {
    if(myToken !== videoCheckToken) return; // superseded by a newer click
    if(mediaEl){
      openLogicVideo(moon, tierKey, tierLabel, andGroup, mediaEl);
    } else {
      showNothingYetToast();
    }
  });
}

// Tries assets/logicvideos/<baseName>.mp4, then .webp, then gives up.
// Calls back with the loaded <video>/<img> element (ready to insert), or
// null if neither file exists — building the actual display element up
// front so a hit can be dropped straight into the stage with no second
// network round trip.
function findLogicVideo(baseName, onSettled){
  let settled = false;
  const video = document.createElement("video");
  video.className = "logic-video";
  video.controls = true;
  video.autoplay = true;
  video.muted = true;
  video.loop = true;
  video.playsInline = true;
  video.preload = "auto";
  video.addEventListener("loadeddata", () => {
    if(settled) return;
    settled = true;
    onSettled(video);
  }, { once: true });
  video.addEventListener("error", () => {
    if(settled) return;
    settled = true;
    const img = document.createElement("img");
    img.className = "logic-video";
    img.alt = "";
    img.addEventListener("load", () => onSettled(img), { once: true });
    img.addEventListener("error", () => onSettled(null), { once: true });
    img.src = "assets/logicvideos/" + baseName + ".webp";
  }, { once: true });
  video.src = "assets/logicvideos/" + baseName + ".mp4";
}

function showNothingYetToast(){
  if(nothingYetTimer) clearTimeout(nothingYetTimer);
  nothingYetToast.classList.add("show");
  nothingYetTimer = setTimeout(() => {
    nothingYetToast.classList.remove("show");
    nothingYetTimer = null;
  }, 2200);
}

function openLogicVideo(moon, tierKey, tierLabel, andGroup, mediaEl){
  // --- Left info box -----------------------------------------------
  videoInfoBox.innerHTML = "";
  videoInfoBox.classList.remove("play-in");

  if(moon.kingdom){
    const kingdomEl = document.createElement("div");
    kingdomEl.className = "video-info-kingdom";
    kingdomEl.textContent = moon.kingdom;
    videoInfoBox.appendChild(kingdomEl);
  }

  const nameEl = document.createElement("div");
  nameEl.className = "video-info-name";
  nameEl.textContent = moon.name;
  videoInfoBox.appendChild(nameEl);

  const pill = document.createElement("span");
  pill.className = "tier-pill";
  pill.textContent = tierLabel || TIER_PILL_LABEL[tierKey] || tierKey;
  videoInfoBox.appendChild(pill);

  const optsEl = document.createElement("div");
  optsEl.className = "tier-options";
  if(!andGroup || andGroup.length === 0){
    const chip = document.createElement("div");
    chip.className = "option-chip free-chip";
    chip.textContent = "Free";
    optsEl.appendChild(chip);
  } else {
    const chip = document.createElement("div");
    chip.className = "option-chip";
    sortedTokensForDisplay(andGroup).forEach((token, j) => {
      if(j > 0){
        const plus = document.createElement("span");
        plus.className = "and-plus";
        plus.textContent = "+";
        chip.appendChild(plus);
      }
      chip.appendChild(makeIcon(token));
    });
    optsEl.appendChild(chip);
  }
  videoInfoBox.appendChild(optsEl);

  // Re-trigger the slide/fade-in every time this opens, even for the same
  // DOM elements re-used across opens — a plain class add wouldn't replay
  // the animation on a class that's already present, so force a reflow
  // between removing and re-adding it.
  void videoInfoBox.offsetWidth;
  videoInfoBox.classList.add("play-in");

  // --- Right video stage ---------------------------------------------
  videoStage.querySelectorAll(".logic-video").forEach(el => {
    if(el.tagName === "VIDEO") el.pause();
    el.remove();
  });
  videoStage.appendChild(mediaEl);
  videoStage.classList.remove("play-in");
  void videoStage.offsetWidth;
  videoStage.classList.add("play-in");

  videoOverlay.classList.add("open");
}

function closeLogicVideo(){
  videoOverlay.classList.remove("open");
  videoStage.querySelectorAll(".logic-video").forEach(el => {
    if(el.tagName === "VIDEO") el.pause();
    el.remove();
  });
}

videoClose.addEventListener("click", closeLogicVideo);
videoOverlay.addEventListener("click", (e) => { if(e.target === videoOverlay) closeLogicVideo(); });
document.addEventListener("keydown", (e) => {
  if(e.key === "Escape" && videoOverlay.classList.contains("open")) closeLogicVideo();
});

async function init(){
  const autoloaded = await tryAutoload();
  if(autoloaded){
    buildSearchIndex();
    initFilterBars();
  } else {
    setStatus("No kingdom files found in /logic/graph-editor/saves/kingdoms/ yet — add some there.", true);
  }
}

init();
</script>
