function crossProduct(a, b){
  if(!b) return a;
  const out = [];
  a.forEach(ga => b.forEach(gb => out.push(ga.concat(gb))));
  return out;
}

/* =========================================================
   SCENARIO DATA — a routeEdge's requirement_expr can differ by
   in-game scenario (pre- vs post-"World Peace"/story-completion).
   Rather than one flat requirement, an edge's option_scenarios
   field is a semicolon-joined list, one entry per TOP-LEVEL "|"
   branch of requirement_expr, in the same left-to-right order —
   the exact same pairing convention parseMoon already uses for
   the difficulty column against DNF branches. e.g. Sand Kingdom's
   "On the Lone Pillar" reach edge is "Kakku | Killer" with
   option_scenarios "3,4,5;1,2,3,4,5": Kakku (Glydon) only works
   scenarios 3-5 (post-World Peace), Killer (Bullet Bill) works
   1-5 (always). This is NOT read from legacy_requirement_notes —
   that field is raw free-text kept only for human cross-reference
   in the source export and is never parsed or trusted by any
   logic in this file; option_scenarios is the real structured
   field this uses.
   Deliberately separate from exprToDNF (which many callers use
   without ever having scenario data) so existing call sites are
   unaffected; only call sites that actually have an edge's
   option_scenarios opt into scenario tagging.
   ========================================================= */
function splitTopLevelOrBranches(expr){
  // Re-parses just enough to recover the top-level "|" branch count/order
  // (mirrors parseOr/astToDNF's flattening, without expanding AND/OR
  // combinations) so branch i here lines up with option_scenarios entry i.
  const trimmed = (expr || "").trim();
  if(trimmed === "" || trimmed.toLowerCase() === "free") return [""];
  const ast = parseExprToAst(trimmed);
  return ast.type === "or" ? ast.args.length : 1;
}
function parseScenarioList(str){
  // "3,4,5" -> [3,4,5]; "" / missing -> null (no scenario restriction, i.e.
  // this branch is active in every scenario).
  const trimmed = (str || "").trim();
  if(!trimmed) return null;
  return trimmed.split(",").map(s => parseInt(s.trim(), 10)).filter(n => !Number.isNaN(n));
}
function scenarioListLabel(list){
  if(!list || !list.length) return null;
  // Render a contiguous run as "N-M", otherwise comma-join. Sorted first
  // since source data is already ascending but this stays correct either way.
  const sorted = [...list].sort((a,b) => a-b);
  const isRun = sorted.every((v,i) => i===0 || v === sorted[i-1]+1);
  if(isRun && sorted.length > 1) return `Scenario ${sorted[0]}-${sorted[sorted.length-1]}`;
  if(sorted.length === 1) return `Scenario ${sorted[0]}`;
  return `Scenarios ${sorted.join(",")}`;
}
/* Same job as exprToDNF, but additionally tags every returned branch with
   the scenario list it's restricted to (or null = unrestricted), read from
   the edge's option_scenarios field. Returns [{group:[tok,...], scenarios:[...]|null}]
   instead of a bare array of groups. Falls back to untagged (scenarios:null)
   for every branch if option_scenarios is empty/missing or its branch count
   doesn't match the expression's top-level OR count (a data gap) — same
   fail-open pattern tiersForGroups uses for a difficulty-count mismatch. */
function exprToScenarioDNF(expr, optionScenarios){
  const dnf = exprToDNF(expr);
  const topLevelCount = splitTopLevelOrBranches(expr);
  const raw = (optionScenarios || "").split(";").map(s => s.trim());
  // dnf.length can exceed topLevelCount when a nested AND itself contains an
  // OR that astToDNF expanded; in that case there's no clean 1:1 branch
  // mapping to trust, so scenario tags are skipped rather than misapplied.
  if(!optionScenarios || raw.length !== topLevelCount || dnf.length !== topLevelCount){
    return dnf.map(group => ({ group, scenarios: null }));
  }
  return dnf.map((group, i) => ({ group, scenarios: parseScenarioList(raw[i]) }));
}

/* =========================================================
   CHECKPOINT LOOKUP — for every node in a kingdom, work out
   which Checkpoint (node_type === "checkpoint") OR Custom Node
   (node_type === "custom_place", e.g. "Outer Wall Area") a
   player would realistically be closest to / arrive from, so
   each moon card can say "tracked from <Name>".

   Custom Nodes are human-authored logic places — when one has
   been placed directly on a moon (or on a node the moon's BFS
   would otherwise walk through), that's a deliberate, more
   specific tag than "nearest Checkpoint" and should win over
   an inherited/propagated checkpoint. So both node_type ===
   "checkpoint" and node_type === "custom_place" are treated as
   *sources* the BFS can trace back to — but a node that IS a
   custom_place always reports its own name first (its own tag
   is authoritative, never overwritten by something that merely
   routes through it), and any node whose *nearest* source turns
   out to be a custom_place is labeled with that Custom Node
   instead of continuing to fall through to a checkpoint further
   away. If a node already carries a checkpoint of its own
   (node_type === "checkpoint"), that checkpoint is likewise
   never replaced by a neighboring custom_place.

   This does a multi-source breadth-first search that starts
   at every checkpoint node AND every custom_place node
   simultaneously and walks forward along routeEdges (skipping
   edges whose requirement_expr is the literal "impossible" —
   those are one-way-blocked directions, e.g. the reverse of an
   exit-only pipe). The first source (checkpoint or custom
   node) to reach a given node (fewest hops) is recorded as
   that node's tracked-from location — ties, i.e. a checkpoint
   and a custom_place at equal distance, favor the custom_place
   since it's the more specific, hand-placed tag.

   Subarea stages (Mysterious Clouds, 8-Bit Chasm Lifts, etc.)
   are only connected to the overworld via matching entrance_id
   pairs (a "home_entrance" node in the overworld stage and a
   "substage_entrance" node in the subarea stage share the same
   entrance_id) — there usually isn't an explicit routeEdge
   between them, since that link is implicit in the game itself.
   Those pairs are bridged here so checkpoints/custom nodes can
   "reach" into subareas too.

   This all runs automatically for every kingdom's workspace —
   there's no per-kingdom or per-node-name special-casing, so any
   Custom Node in any of the 17 kingdoms (Outer Wall Area, etc.)
   is picked up the moment it's tagged node_type "custom_place".
   ========================================================= */
function buildCheckpointLookup(nodes, edges){
  const displayNameOf = {};
  (nodes || []).forEach(n => { displayNameOf[n.node_id] = n.display_name; });

  const adj = {};
  const addEdge = (from, to) => {
    if(!from || !to) return;
    (adj[from] = adj[from] || []).push(to);
  };

  (edges || []).forEach(e => {
    if(!e.from_node_id || !e.to_node_id) return;
    if((e.requirement_expr || "").trim().toLowerCase() === "impossible") return;
    addEdge(e.from_node_id, e.to_node_id);
    if(String(e.bidirectional).toLowerCase() === "true"){
      addEdge(e.to_node_id, e.from_node_id);
    }
  });

  // Bridge overworld <-> subarea via matching entrance_id (implicit pipe link).
  const byEntranceId = {};
  (nodes || []).forEach(n => {
    if(!n.entrance_id) return;
    if(n.node_type !== "home_entrance" && n.node_type !== "substage_entrance") return;
    (byEntranceId[n.entrance_id] = byEntranceId[n.entrance_id] || []).push(n.node_id);
  });
  Object.values(byEntranceId).forEach(nodeIds => {
    for(let i = 0; i < nodeIds.length; i++){
      for(let j = 0; j < nodeIds.length; j++){
        if(i === j) continue;
        addEdge(nodeIds[i], nodeIds[j]);
      }
    }
  });

  // Seed the BFS from every checkpoint AND every custom_place node.
  // Custom Nodes are queued *first* so that if a checkpoint and a
  // custom_place are equidistant from some node (both would reach it on
  // the same BFS pass), the custom_place claims it first — its explicit,
  // hand-placed tag beats an inherited checkpoint at the same distance.
  // A node that IS a source (checkpoint or custom_place) always maps to
  // itself and is never later relabeled by a neighboring source — see
  // the `sourceType[next]` guard in the BFS loop below.
  const checkpointOf = {};
  const sourceType = {}; // node_id -> "checkpoint" | "custom_place", for source nodes only
  const queue = [];

  (nodes || []).forEach(n => {
    if(n.node_type === "custom_place"){
      checkpointOf[n.node_id] = n.node_id;
      sourceType[n.node_id] = "custom_place";
      queue.push(n.node_id);
    }
  });
  (nodes || []).forEach(n => {
    if(n.node_type === "checkpoint" && !(n.node_id in checkpointOf)){
      checkpointOf[n.node_id] = n.node_id;
      sourceType[n.node_id] = "checkpoint";
      queue.push(n.node_id);
    }
  });

  let qi = 0;
  while(qi < queue.length){
    const cur = queue[qi++];
    const origin = checkpointOf[cur];
    (adj[cur] || []).forEach(next => {
      // Never overwrite a node that is itself a checkpoint/custom_place
      // source — its own tag always wins over anything propagating
      // through it, automatically, with no per-kingdom special-casing.
      if(sourceType[next]) return;
      if(!(next in checkpointOf)){
        checkpointOf[next] = origin;
        queue.push(next);
      }
    });
  }

  // Each entry carries both the display name AND the source's node_type
  // ("checkpoint" or "custom_place"), so callers can tell the two apart —
  // e.g. to pick a different icon for Custom Nodes — without re-deriving
  // it from the raw nodes list. This is automatic for every node tagged
  // custom_place, in every kingdom, present or future; nothing here is
  // keyed off a specific node name or kingdom.
  const lookup = {};
  Object.keys(checkpointOf).forEach(nodeId => {
    const cpId = checkpointOf[nodeId];
    let name = displayNameOf[cpId] || cpId;
    // Strip the trailing "(objXXX)" the editor appends to checkpoint names.
    name = name.replace(/\s*\([^)]*\)\s*$/, "");
    // `id` is the source checkpoint/custom_place's own raw node_id (cpId,
    // NOT the possibly-different node the BFS reached it from) — needed so
    // the click-to-inspect popup can look up that source node's own reach
    // requirements (see buildNodeReachIndex) instead of just displaying its name.
    lookup[nodeId] = { name, type: sourceType[cpId] || "checkpoint", id: cpId };
  });
  return lookup;
}

/* =========================================================
   MOON PARSER — turns one moonAccess row into the render
   shape: { name, orGroups, subarea, badges, checkpoint }
   ========================================================= */
/* Known difficulty tiers, in the fixed display order every moon card uses.
   "unrated" is a catch-all for rows whose difficulty column doesn't line
   up 1:1 with its OR-branches (a handful of edge cases in raw exports) —
   those routes still render, just without a tier label attached. */
const TIER_ORDER = ["casual", "advanced", "expert", "glitched", "unrated"];
const TIER_LABEL = { casual:"Casual", advanced:"Advanced", expert:"Expert", glitched:"Glitched", unrated:"Unrated" };

/* Splits row.difficulty ("casual;advanced;expert") and pairs each entry,
   in order, with the matching OR-branch in `dnf` (both are built by
   walking the requirement_expr left-to-right, so branch i <-> tier i).
   If the counts don't match — a rare data-entry gap — every branch is
   dropped into "unrated" instead of guessing which tier it belongs to. */
function tiersForGroups(dnf, difficultyField){
  const raw = (difficultyField || "").split(";").map(s => s.trim().toLowerCase()).filter(Boolean);
  if(raw.length !== dnf.length){
    return dnf.map(() => "unrated");
  }
  return raw.map(t => TIER_ORDER.includes(t) ? t : "unrated");
}

function parseMoon(row, nodeMap, checkpointLookup, kingdomName, customNodeReachExpr, customNodeReachBranches){
  // scenarios[i] = scenario-number array (or null = unrestricted) for
  // branch i, parallel to dnf/tiers. Populated from moonAccess's own
  // option_scenarios column when it lines up 1:1 with requirement_expr's
  // top-level OR branches (e.g. "The Hole in the Desert": "(BossKnuckleHand
  // & Killer) | Killer" / "1,2,3,4,5;3,4,5"), and further narrowed below
  // by any custom-node reach edge's own option_scenarios. This is read
  // ONLY from the structured option_scenarios field — never from
  // legacy_requirement_notes, which is raw free-text kept purely for
  // human cross-reference and is not parsed anywhere in this file.
  const seeded = exprToScenarioDNF(row.requirement_expr, row.option_scenarios);
  let dnf = seeded.map(b => b.group);
  let scenarios = seeded.map(b => b.scenarios);
  let tiers = tiersForGroups(dnf, row.difficulty);

  // If this moon sits on a custom_place (e.g. Rooftop), cross in whatever
  // it costs to reach that node in the first place, so a moon that's
  // "free" once you're up there still shows the real ability/capture
  // requirement to get up there. Skips silently if the node has no
  // costed inbound edge (i.e. it really is free to reach).
  const reachExpr = customNodeReachExpr && customNodeReachExpr[row.from_node_id];
  const reachBranches = customNodeReachBranches && customNodeReachBranches[row.from_node_id];
  if(reachExpr){
    const reachDnf = reachBranches ? reachBranches.map(b => b.group) : exprToDNF(reachExpr);
    const reachScenarios = reachBranches ? reachBranches.map(b => b.scenarios) : reachDnf.map(() => null);
    const expandedTiers = [];
    const expandedScenarios = [];
    dnf.forEach((_, i) => reachDnf.forEach((_, j) => {
      expandedTiers.push(tiers[i]);
      // Combine the moon's own scenario restriction (if any) with the
      // reach-edge branch's restriction via intersection: a branch is only
      // valid in a scenario if BOTH sides allow it. null = unrestricted on
      // that side, so it doesn't narrow anything.
      const a = scenarios[i], b = reachScenarios[j];
      if(a && b) expandedScenarios.push(a.filter(n => b.includes(n)));
      else expandedScenarios.push(a || b || null);
    }));
    dnf = crossProduct(dnf, reachDnf);
    tiers = expandedTiers;
    scenarios = expandedScenarios;
  }
  if(row.state_requirement_expr && row.state_requirement_expr.trim()){
    const stateDnf = exprToDNF(row.state_requirement_expr);
    // Every original branch gets crossed with every state-requirement
    // branch; its tier label (and scenario tag) ride along unchanged to
    // each of those copies, since state_requirement_expr carries no
    // scenario data of its own.
    const expandedTiers = [];
    const expandedScenarios = [];
    dnf.forEach((_, i) => stateDnf.forEach(() => { expandedTiers.push(tiers[i]); expandedScenarios.push(scenarios[i]); }));
    dnf = crossProduct(dnf, stateDnf);
    tiers = expandedTiers;
    scenarios = expandedScenarios;
  }

  const badges = [];
  if(String(row.shine_info_is_moon_rock).toLowerCase() === "true") badges.push("moonRock");

  // World Peace can show up two ways in an export: (a) as a literal token
  // inside requirement_expr, filtered out below, or (b) as a standalone
  // boolean flag field (same pattern as shine_info_is_moon_rock) with no
  // token in the expression at all — e.g. postgame-only moons that are
  // otherwise "free". Scan for any *_world_peace* flag key (but not the
  // *_token field, handled separately below) so both shapes are caught
  // regardless of the exact field name a given export uses.
  Object.keys(row).forEach(key => {
    if(!/world_peace/i.test(key) || /token/i.test(key)) return;
    const v = row[key];
    const truthy = v === true || v === 1 || /^(true|1|yes)$/i.test(String(v).trim());
    if(truthy && !badges.includes("worldPeace")) badges.push("worldPeace");
  });

  dnf = dnf.map(group => group.filter(tok => {
    if(row.moon_rock_token && tok === row.moon_rock_token){
      if(!badges.includes("moonRock")) badges.push("moonRock");
      return false;
    }
    if(row.world_peace_token && tok === row.world_peace_token){
      if(!badges.includes("worldPeace")) badges.push("worldPeace");
      return false;
    }
    // Base moveset the player always has (Single Jump, etc.) — not a real
    // requirement, so it's dropped rather than shown as a token/icon.
    if(ALWAYS_UNLOCKED_TOKENS[tok]) return false;
    // "Access to the kingdom you're already standing in" isn't a real
    // requirement either — e.g. KingdomAccess_Bowsers on a Bowser's
    // Kingdom moon. Access to a *different* kingdom (a cross-kingdom
    // moon, like KingdomAccess_Sand showing up in Bowser's Kingdom) is
    // still a genuine requirement and stays shown.
    if(KINGDOM_ACCESS_TOKEN_TO_KINGDOM[tok] && KINGDOM_ACCESS_TOKEN_TO_KINGDOM[tok] === kingdomName){
      return false;
    }
    return true;
  }));

  let subarea = null;
  let subareaStage = null; // raw stage key (e.g. "WaterTubeExStage"), not the display name — used to find sibling entrances
  const node = nodeMap[row.from_node_id];
  if(node && node.area_scope === "subarea"){
    subarea = node.stage_display_name;
    subareaStage = node.stage;
  }
  const subareaNodeId = subarea ? row.from_node_id : null;

  const checkpointEntry = (checkpointLookup && checkpointLookup[row.from_node_id]) || null;
  const checkpoint = checkpointEntry ? checkpointEntry.name : null;
  const checkpointType = checkpointEntry ? checkpointEntry.type : null;
  const checkpointNodeId = checkpointEntry ? checkpointEntry.id : null;

  if(/^Secret Path/i.test(row.moon_name)){
    dnf = [["PaintingAccess"]];
    tiers = ["casual"];
    scenarios = [null];
  }

  // --- Manual per-moon overrides -----------------------------------------
  // Both maps key on the exact moon_name string (case-sensitive, must match
  // moonAccess exactly). Intentionally NOT a blanket toggle — only moons
  // listed here are affected, everything else keeps its normal computed
  // scenario data / logic-level tier. Meant for individual non-story moons
  // where the raw data is misleading or incomplete (e.g. a moon whose
  // scenario split doesn't reflect real in-game behavior, or whose CSV
  // difficulty rating needs a manual correction) — NOT for hiding/
  // reclassifying moons in bulk.
  //
  // SCENARIO_DATA_HIDDEN_MOONS: every branch's scenario tag is cleared
  // (chips render with no "Scenario X" pill) for a listed moon, as if
  // option_scenarios were empty for it. Add a moon_name string to hide it:
  //   "Some Moon Name",
  if(SCENARIO_DATA_HIDDEN_MOONS.has(row.moon_name)){
    scenarios = scenarios.map(() => null);
  }
  // LOGIC_LEVEL_OVERRIDES: forces every branch of a listed moon to the
  // given tier, overriding whatever tiersForGroups computed from the CSV's
  // difficulty column. Value must be one of TIER_ORDER ("casual",
  // "advanced", "expert", "glitched", "unrated") or it's ignored (falls
  // back to the computed tier) rather than silently producing an empty
  // tier-lane. Add an entry to override a moon:
  //   "Some Moon Name": "expert",
  if(Object.prototype.hasOwnProperty.call(LOGIC_LEVEL_OVERRIDES, row.moon_name)){
    const overrideTier = LOGIC_LEVEL_OVERRIDES[row.moon_name];
    if(TIER_ORDER.includes(overrideTier)){
      tiers = tiers.map(() => overrideTier);
    }
  }

  if(FORCE_FREE_MOONS.has(row.moon_name)){ dnf = []; tiers = []; scenarios = []; }

  const isFree = dnf.every(g => g.length === 0);
  const hintIdx = parseInt(row.shine_info_hint_idx, 10);

  // Bucket every OR-branch into its tier lane, preserving left-to-right
  // order within a lane. Each group in a lane carries its own scenario tag
  // along with it (groups[i].scenarios), read by the renderer to show a
  // per-branch "Scenario X-Y" chip when that branch is scenario-restricted.
  // A "Free" moon has no branches/tiers/scenarios at all.
  const tierLanes = [];
  if(!isFree){
    TIER_ORDER.forEach(tierKey => {
      const groups = dnf
        .map((group, i) => ({ group, scenarios: scenarios[i] }))
        .filter((_, i) => tiers[i] === tierKey)
        .map(g => Object.assign(g.group, { scenarios: g.scenarios })); // group stays an array (existing renderers iterate it as tokens); scenarios tags along as a non-enumerable-safe extra property
      if(groups.length) tierLanes.push({ tier: tierKey, label: TIER_LABEL[tierKey], groups });
    });
  }

  return {
    name: row.moon_name,
    kingdom: kingdomName,
    orGroups: isFree ? [] : dnf,
    tierLanes,
    subarea,
    subareaStage,
    subareaNodeId,
    checkpoint,
    checkpointType,
    checkpointNodeId,
    badges,
    hintIdx: Number.isNaN(hintIdx) ? null : hintIdx,
  };
}

const MOON_FIXED_ORDER_INDEX = {};
MOON_FIXED_ORDER.forEach((name, i) => { MOON_FIXED_ORDER_INDEX[name] = i; });

function sortMoonsByHintOrder(moons){
  return moons
    .map((moon, i) => ({ moon, i }))
    .sort((a, b) => {
      const afi = MOON_FIXED_ORDER_INDEX[a.moon.name];
      const bfi = MOON_FIXED_ORDER_INDEX[b.moon.name];
      const ai = afi !== undefined ? afi
        : (a.moon.hintIdx === null ? Infinity : a.moon.hintIdx + MOON_FIXED_ORDER.length);
      const bi = bfi !== undefined ? bfi
        : (b.moon.hintIdx === null ? Infinity : b.moon.hintIdx + MOON_FIXED_ORDER.length);
      if(ai !== bi) return ai - bi;
      return a.i - b.i; // stable fallback when neither has an order
    })
    .map(x => x.moon);
}

   FILE LOADING
   ========================================================= */
let KINGDOMS = {};
let KINGDOM_ORDER = [];
// kingdom display name -> { nodeMap, nodes, reachBranches } — see loadKingdomFile.
let KINGDOM_NODE_DATA = {};

/* =========================================================
   NODE REACH REQUIREMENTS — ANY node (a custom_place like
   Bullet Bill Maze's "Rooftop", but just as much a plain
   substage_entrance like a subarea's far-side pipe) can be a
   hand-placed *destination* that isn't free to reach: getting
   there costs whatever the incoming routeEdge(s) say (Backflip &
   WallJump, Hosui, etc). A moon whose from_node_id IS one of
   these nodes needs that reach cost folded into its own
   requirement_expr, or the moon reads as flatly "free" while
   actually gating on movement/captures/abilities.

   This used to only run for node_type === "custom_place" nodes,
   which silently missed subarea entrances that are only reachable
   via another entrance in the same subarea — e.g. Freezing
   Waterway's far-side pipe (WaterTubeExStage's EX_2DHosui_Exit)
   only opens up after swimming through with Hosui from the near
   side, but "Through the Freezing Waterway" (from_node_id = that
   far entrance) rendered as completely Free. Dropping the
   custom_place-only filter fixes that automatically, for every
   subarea's entrances in every kingdom, with no per-node or
   per-kingdom special-casing — the exact same one-hop
   inbound-edge fold already used for custom nodes just now
   applies uniformly to every node_id that has a real (non-free,
   non-impossible) inbound routeEdge.

   Every returned branch also carries its own `tier` (paired off
   that edge's own `difficulty` column exactly the way moonAccess's
   difficulty column pairs off requirement_expr — see
   tiersForGroups), so a reach requirement can be shown with its
   own Casual/Advanced/Expert/Glitched lane, not just as a flat
   list of tokens. This is what powers the click-to-inspect node
   popup (see openNodeInfo) in addition to feeding into parseMoon.

   Built once per kingdom load, generically, for every node with
   inbound edges — no per-kingdom/per-node special-casing, so this
   covers all 17 kingdoms automatically as new nodes/edges are
   added in logic_nodes.csv / route_edges.csv.
   ========================================================= */
function buildNodeReachIndex(nodes, edges){
  const reachExprs = {}; // node_id -> OR-joined string of all viable inbound edge exprs (legacy shape, kept for any other caller)
  const reachBranches = {}; // node_id -> [{group:[tok,...], scenarios:[...]|null, tier, fromNodeId, edgeId}, ...] (one entry per edge's own top-level OR branch)
  (edges || []).forEach(e => {
    if(!e.to_node_id || !e.from_node_id) return;
    const req = (e.requirement_expr || "").trim();
    if(!req || req.toLowerCase() === "impossible") return;
    if(req.toLowerCase() === "free") return; // free-to-reach: nothing to fold in
    const wrapped = req.includes("|") || req.includes("&") ? `(${req})` : req;
    reachExprs[e.to_node_id] = reachExprs[e.to_node_id] ? `${reachExprs[e.to_node_id]} | ${wrapped}` : wrapped;

    // Scenario-tagged version: each edge is resolved to its OWN branches
    // (with its OWN option_scenarios) BEFORE being combined across edges,
    // so two different inbound edges into the same node never have their
    // scenario lists cross-mixed against each other's branch counts. Tiers
    // are paired the same way, off this same edge's own `difficulty`
    // column, so branch i of THIS edge always keeps its own tier/scenario
    // even after being concatenated with other edges' branches below.
    const dnf = exprToDNF(req);
    const tiers = tiersForGroups(dnf, e.difficulty);
    const taggedBranches = exprToScenarioDNF(req, e.option_scenarios)
      .map((b, i) => Object.assign({}, b, { tier: tiers[i] || "unrated", fromNodeId: e.from_node_id, edgeId: e.edge_id }));
    reachBranches[e.to_node_id] = (reachBranches[e.to_node_id] || []).concat(taggedBranches);
  });
  return { reachExprs, reachBranches };
}

/* =========================================================
   PER-ENTRANCE REQUIREMENTS (subareas)
   For a subarea moon: "what does it cost if I come in through THIS
   pipe?" = cheapest-path cost from that entrance to the moon's own
   from_node (walking the subarea's own routeEdges, honouring
   bidirectional/impossible) crossed with the moon's OWN requirement.
   No path at all => Impossible. Same-node => just the moon's own cost.
   ========================================================= */
const ENTRANCE_PIPE_LABEL = { sub_near: "Entrance Pipe", sub_far: "Exit Pipe" };
const TIER_RANK = {}; TIER_ORDER.forEach((t, i) => { TIER_RANK[t] = i; });

function pipeLabel(en, all){
  const base = all.length === 1 ? "Entrance Pipe" : ENTRANCE_PIPE_LABEL[en.side];
  return all.filter(x => x.side === en.side).length > 1 ? base + " (" + en.entrance_id + ")" : base;
}

function subareaEntrances(nodes, stage){
  const raw = (nodes || []).filter(n => n.stage === stage && n.node_type === "substage_entrance"
    && n.source === "EntranceDB" && (n.side === "sub_near" || n.side === "sub_far"))
    .sort((a, b) => (a.side === "sub_near" ? 0 : 1) - (b.side === "sub_near" ? 0 : 1));
  // A link whose in- and out-entrance are the SAME id (e.g. Dinosaur Nest's
  // RexPoppunEx) is one physical pipe, not an entrance + an exit: collapse its
  // near/far nodes into a single pipe (keeping both node ids as aliases).
  const out = [];
  raw.forEach(n => {
    const twin = out.find(o => o.entrance_id === n.entrance_id && o.side !== n.side);
    if(twin){ twin.aliasNodes.push(n); return; }
    out.push(Object.assign({}, n, { aliasNodes: [n] }));
  });
  return out;
}

function crossBranches(A, B){
  const out = [];
  A.forEach(a => B.forEach(b => {
    let sc;
    if(a.scenarios && b.scenarios) sc = a.scenarios.filter(n => b.scenarios.includes(n));
    else sc = a.scenarios || b.scenarios || null;
    if(sc && sc.length === 0) return; // no scenario where both hold
    const group = Array.from(new Set(a.group.concat(b.group)));
    const tier = (TIER_RANK[a.tier] || 0) >= (TIER_RANK[b.tier] || 0) ? a.tier : b.tier;
    out.push({ group, scenarios: sc, tier });
  }));
  return out;
}

function edgeBranches(e){
  const req = (e.requirement_expr || "").trim();
  if(!req || req.toLowerCase() === "free") return [{ group: [], scenarios: null, tier: "casual" }];
  const tiers = tiersForGroups(exprToDNF(req), e.difficulty);
  return exprToScenarioDNF(req, e.option_scenarios).map((b, i) => ({ group: b.group.slice(), scenarios: b.scenarios || null, tier: tiers[i] || "unrated" }));
}

// Branches (or null = impossible) for walking fromId -> toId inside one stage.
function reachWithinStage(nodeMap, edges, stage, fromId, toId){
  if(fromId === toId) return [{ group: [], scenarios: null, tier: "casual" }];
  const adj = {};
  const add = (a, b, e) => { (adj[a] = adj[a] || []).push({ to: b, e }); };
  (edges || []).forEach(e => {
    const a = nodeMap[e.from_node_id], b = nodeMap[e.to_node_id];
    if(!a || !b || a.stage !== stage || b.stage !== stage) return;
    const req = (e.requirement_expr || "").trim().toLowerCase();
    if(req === "impossible") return;
    add(e.from_node_id, e.to_node_id, e);
    if(/^(true|1|yes|y)$/i.test(String(e.bidirectional).trim())) add(e.to_node_id, e.from_node_id, e);
  });
  let result = [];
  const seen = new Set([fromId]);
  reachWithinStage.lastWhy = null;
  (function dfs(cur, acc, depth){
    if(depth > 8 || result.length > 200) return;
    if(cur === toId){ result = result.concat(acc); return; }
    (adj[cur] || []).forEach(({ to, e }) => {
      if(seen.has(to)) return;
      seen.add(to);
      dfs(to, crossBranches(acc, edgeBranches(e)), depth + 1);
      seen.delete(to);
    });
  })(fromId, [{ group: [], scenarios: null, tier: "casual" }], 0);
  if(!result.length){
    const explicit = (edges || []).some(e => e.from_node_id === fromId && String(e.requirement_expr || "").trim().toLowerCase() === "impossible");
    reachWithinStage.lastWhy = (adj[fromId] || []).length === 0
      ? (explicit ? "only explicit 'impossible' edges leave this pipe" : "no edges leave this pipe in the data")
      : "edges leave this pipe but none lead to the moon's tracked node";
  }
  return result.length ? result : null;
}

// Cleans + dedupes branches; returns { impossible } | { free } | { lanes }
function summarizeBranches(branches, kingdomName){
  if(!branches || !branches.length) return { impossible: true };
  const seenKeys = new Set();
  const clean = [];
  branches.forEach(b => {
    const group = b.group.filter(tok => !ALWAYS_UNLOCKED_TOKENS[tok]
      && !(KINGDOM_ACCESS_TOKEN_TO_KINGDOM[tok] && KINGDOM_ACCESS_TOKEN_TO_KINGDOM[tok] === kingdomName));
    const key = group.slice().sort().join("+") + "|" + b.tier + "|" + (b.scenarios ? b.scenarios.join(",") : "");
    if(seenKeys.has(key)) return;
    seenKeys.add(key);
    clean.push({ group, scenarios: b.scenarios, tier: b.tier });
  });
  if(clean.some(b => b.group.length === 0 && !b.scenarios)) return { free: true };
  const lanes = buildTierLanesFromBranches(clean);
  return lanes ? { lanes } : { free: true };
}

const PIPE_PROXIMITY = 2500; // game units: a moon this close to a pipe is physically AT that pipe

function moonPlacement(row){
  const p = [row.placement_x, row.placement_y, row.placement_z].map(v => parseFloat(v));
  return p.every(v => Number.isFinite(v)) ? p : null;
}

function computeEntranceReqs(row, ownMoon, ws, nodeMap, kingdomName){
  const node = nodeMap[row.from_node_id];
  if(!node || node.area_scope !== "subarea") return null;
  const entrances = subareaEntrances(ws.logicNodes, node.stage);
  // 1 pipe (one-entrance subareas like Dinosaur Nest) or an unambiguous
  // Entrance Pipe + Exit Pipe pair. Anything busier is skipped.
  if(entrances.length < 1 || entrances.length > 2) return null;
  if(entrances.length === 2 && entrances[0].side === entrances[1].side) return null;
  const own = (ownMoon.tierLanes && ownMoon.tierLanes.length)
    ? ownMoon.tierLanes.reduce((acc, lane) => acc.concat(lane.groups.map(g => ({ group: g.slice(), scenarios: g.scenarios || null, tier: lane.tier }))), [])
    : [{ group: [], scenarios: null, tier: "casual" }];
  const place = moonPlacement(row);
  return entrances.map(en => {
    let reach = null;
    en.aliasNodes.forEach(alias => {
      const r = reachWithinStage(nodeMap, ws.routeEdges, node.stage, alias.node_id, row.from_node_id);
      if(r) reach = (reach || []).concat(r);
    });
    // Interpreted from placement: if the moon physically sits at this pipe
    // (within PIPE_PROXIMITY), coming in through it needs no traversal at all
    // — only the moon's own requirement.
    let atPipe = false;
    if(place) en.aliasNodes.forEach(alias => {
      const q = [alias.x, alias.y, alias.z].map(v => parseFloat(v));
      if(q.every(v => Number.isFinite(v)) && Math.hypot(place[0]-q[0], place[1]-q[1], place[2]-q[2]) <= PIPE_PROXIMITY) atPipe = true;
    });
    if(atPipe) reach = (reach || []).concat([{ group: [], scenarios: null, tier: "casual" }]);
    const summary = summarizeBranches(reach ? crossBranches(reach, own) : null, kingdomName);
    if(!reach) console.info(`[${kingdomName}] "${row.moon_name}": Impossible from ${pipeLabel(en, entrances)} (${en.node_id}) -> ${row.from_node_id}: ${reachWithinStage.lastWhy}`);
    return Object.assign({ label: pipeLabel(en, entrances) }, summary);
  });
}

// Renders "Free from the Exit Pipe" / "Impossible from ..." / chips rows.
// disableCollapse is forwarded straight through to renderReachTierLanes/
// wrapOptionsIfCollapsible — see the note there.
function renderEntranceReqs(list, className, disableCollapse){
  const wrap = document.createElement("div");
  wrap.className = className || "entrance-reqs";
  list.forEach(r => {
    const row = document.createElement("div");
    row.className = "entrance-req-row";
    const lab = document.createElement("span");
    lab.className = "entrance-req-label";
    lab.textContent = r.label + ":";
    row.appendChild(lab);
    if(r.impossible){
      const t = document.createElement("span"); t.className = "impossible-tag"; t.textContent = "Impossible"; row.appendChild(t);
    } else if(r.free){
      const t = document.createElement("span"); t.className = "free-tag"; t.textContent = "Free"; row.appendChild(t);
    } else {
      row.appendChild(renderReachTierLanes(r.lanes, disableCollapse));
    }
    wrap.appendChild(row);
  });
  return wrap;
}

// Room-traversal summary for a whole subarea: what it costs to get from
// each pipe to the other one.
function computeRoomTraversal(kingdomName, stage){
  const data = KINGDOM_NODE_DATA[kingdomName];
  if(!data) return null;
  const ens = subareaEntrances(data.nodes, stage);
  if(ens.length !== 2) return null; // one-entrance subareas have no pipe-to-pipe route
  return ens.map(from => {
    const to = ens.find(x => x !== from);
    let br = null;
    from.aliasNodes.forEach(fa => to.aliasNodes.forEach(ta => {
      const r = reachWithinStage(data.nodeMap, data.edges, stage, fa.node_id, ta.node_id);
      if(r) br = (br || []).concat(r);
    }));
    const summary = summarizeBranches(br, kingdomName);
    return Object.assign({ label: "From the " + pipeLabel(from, ens) }, summary);
  });
}

// Custom-node groups that should list the requirements of certain subareas below their header.
const GROUP_SUBAREA_SUMMARIES = {
  "Top of the Pyramid": ["SandWorldPyramid000Stage", "SandWorldPyramid001Stage"],
};

function loadKingdomFile(fileData, sourceLabel, forcedName){
  const ws = fileData.workspace;
  // forcedName (from KINGDOM_MANIFEST, keyed off the filename) always wins so
  // "cap_kingdom.json" is Cap Kingdom regardless of what the file's own "kingdom"
  // field says. Manual file-picker loads fall back to the file's own field.
  const kingdomName = forcedName || fileData.kingdom || sourceLabel;
  mergeTokensIntoManifest(ws.logicTokens);

  // Rebuild everything from THIS load's data every time — never reuse a
  // nodeMap/checkpointLookup left over from a previous load of this same
  // kingdom name. Custom nodes (node_type === "custom_place") get added and
  // edited continually in logic_nodes.csv and then re-exported into this
  // kingdom's JSON; without a full rebuild on every load, freshly added or
  // re-pointed custom nodes (e.g. Bullet Bill Maze's "Rooftop") wouldn't
  // show up even though they're present in ws.logicNodes. This is generic —
  // no per-kingdom or per-node-name special-casing — so it picks up custom
  // nodes automatically for all 17 kingdoms, on every load.
  const nodeMap = {};
  (ws.logicNodes || []).forEach(n => { nodeMap[n.node_id] = n; });

  const customPlaceCount = (ws.logicNodes || []).filter(n => n.node_type === "custom_place").length;
  console.log(`[${kingdomName}] loaded ${(ws.logicNodes||[]).length} nodes (${customPlaceCount} custom_place), ${(ws.routeEdges||[]).length} edges`);

  const checkpointLookup = buildCheckpointLookup(ws.logicNodes || [], ws.routeEdges || []);
  const { reachExprs: nodeReachExpr, reachBranches: nodeReachBranches } = buildNodeReachIndex(ws.logicNodes || [], ws.routeEdges || []);

  const moons = sortMoonsByHintOrder((ws.moonAccess || []).map(row => {
    // A moon shows ONLY its own requirement. The cost of reaching its
    // checkpoint/custom node/subarea pipe is node info and lives in the
    // click-to-inspect popup, not folded into the moon (so {} , {} here).
    const moon = parseMoon(row, nodeMap, checkpointLookup, kingdomName, {}, {});
    if(moon.subareaStage){
      const ownOnly = parseMoon(row, nodeMap, checkpointLookup, kingdomName, {}, {});
      moon.entranceReqs = computeEntranceReqs(row, ownOnly, ws, nodeMap, kingdomName);
    }
    return moon;
  }));

  console.log(`[${kingdomName}] per-pipe subarea rows on ${moons.filter(m => m.entranceReqs).length} moon(s): ` + moons.filter(m => m.entranceReqs).map(m => m.name).join(", "));
  if(!KINGDOM_ORDER.includes(kingdomName)) KINGDOM_ORDER.push(kingdomName);
  KINGDOMS[kingdomName] = moons; // always overwrite; never merge with a stale prior entry

  // Kept around (keyed by kingdom display name, same as moon.kingdom) so the
  // click-to-inspect node popup — triggered long after this load, from
  // whichever kingdom is currently on screen — can look up any node's own
  // reach requirements, and for a subarea, walk every substage_entrance
  // node that shares its stage. Always overwritten wholesale on reload,
  // same as KINGDOMS above, so it can never point at stale nodes.
  KINGDOM_NODE_DATA[kingdomName] = { nodeMap, nodes: ws.logicNodes || [], edges: ws.routeEdges || [], reachBranches: nodeReachBranches };
}

function setStatus(text, isError){
  const el = document.getElementById("loadStatus");
  if(!el) return;
  // Only surface errors on the page itself; routine "loaded N kingdoms"
  // status is left out of the UI (still useful during dev — see console).
  console.log(text);
  el.textContent = isError ? text : "";
  el.className = "load-status" + (isError ? " error" : "");
}

async function tryAutoload(){
  // No index.json to fetch first — KINGDOM_MANIFEST already knows every
  // filename and its story order. Just try each one; missing files (404,
  // not-yet-added kingdoms, or file:// with no server) are skipped quietly.
  let loaded = 0;
  for(const entry of KINGDOM_MANIFEST){
    try{
      const res = await fetch("logic/graph-editor/saves/kingdoms/" + entry.file + ".json");
      if(!res.ok) continue;
      const data = await res.json();
      loadKingdomFile(data, entry.file + ".json", entry.name);
      loaded++;
    }catch(err){ /* not reachable yet (file:// or missing file) — skip */ }
  }
  // Optional embedded-data fallback, only used when `logic/*.json` isn't
  // reachable (e.g. this preview build, opened without a server). Harmless
  // no-op in the real deployment, where window.__EMBEDDED_KINGDOMS is never set.
  if(loaded === 0 && window.__EMBEDDED_KINGDOMS){
    window.__EMBEDDED_KINGDOMS.forEach(({data, file, name}) => {
      loadKingdomFile(data, file, name);
      loaded++;
    });
  }
  if(loaded > 0){
    setStatus(`Auto-loaded ${loaded} kingdom file${loaded===1?"":"s"} from /logic/`);
    rebuildKingdomTabs();
    renderKingdom(KINGDOM_ORDER[0]);
    return true;
  }
  return false;
}

function makeIcon(token){
  const info = ICON_MANIFEST[token];
  const label = info ? info.label : token;

  const wrap = document.createElement("span");
  wrap.className = "icon-wrap";
  wrap.tabIndex = 0; // keyboard-focusable, so the tooltip is reachable without a mouse
  wrap.setAttribute("aria-label", label);
  wrap.dataset.token = token;
  // Always-unlocked ("optional") abilities — Swim, MoonLowGravity, etc. —
  // never actually gate a moon, so mark them for a distinct outline in CSS
  // instead of the regular filter-match highlight, letting the player see
  // at a glance that this icon is "free" rather than something they need
  // to have unlocked.
  if(ALWAYS_UNLOCKED_TOKENS[token]) wrap.classList.add("optional-ability");

  if(!info){
    const d = document.createElement("div");
    d.className = "icon-fallback";
    d.textContent = "?";
    wrap.appendChild(d);
  } else {
    const img = document.createElement("img");
    img.className = "icon";
    let attempt = 0;
    img.src = "icon/" + info.filenames[attempt];
    img.alt = info.label;
    img.onerror = function(){
      attempt++;
      if(attempt < info.filenames.length){
        // Try the next filename convention before giving up.
        img.src = "icon/" + info.filenames[attempt];
        return;
      }
      const fb = document.createElement("div");
      fb.className = "icon-fallback";
      fb.style.setProperty("--icon-color", info.color || "#34406e");
      fb.textContent = initialsFor(info.label);
      img.replaceWith(fb);
    };
    wrap.appendChild(img);
  }

  const tip = document.createElement("span");
  tip.className = "icon-tooltip";
  tip.textContent = label;
  wrap.appendChild(tip);

  return wrap;
}

// Small "Kingdom Access" icon used for a kingdom's own label (in the pager)
// and next to each result in the moon search popup. Falls back to the same
// colored-initials chip pattern as makeIcon() when no art file exists yet.

// A moon is "unmarked" if any of its OR-branches landed in the "unrated"
// tier lane — i.e. its difficulty column didn't line up with its
// requirement_expr branches, so the logic hasn't been fully tagged yet.
// This is exactly the data-entry gap TIER_ORDER's "unrated" catch-all
// exists for, so it doubles as the "still needs a difficulty pass" flag.
function isMoonUnmarked(moon){
  return (moon.tierLanes || []).some(lane => lane.tier === "unrated");
}

function hasGlitchedLane(moon){
  return (moon.tierLanes || []).some(lane => lane.tier === "glitched");
}

function buildMoonCard(moon){
  const card = document.createElement("div");
  card.className = "moon-card";
  card.dataset.moonName = moon.name;

  const name = document.createElement("p");
  name.className = "moon-name";
  name.textContent = moon.name;
  card.appendChild(name);

  if(moon.badges && moon.badges.length){
    const badgeRow = document.createElement("div");
    badgeRow.className = "badges";
    moon.badges.forEach(b=>{
      const info = b === "moonRock" ? {label:"Moon Rock", file:"badge-moon-rock.png"} : {label:"World Peace", file:"badge-world-peace.png"};
      const el = document.createElement("div");
      el.className = "badge " + b.toLowerCase();
      el.title = info.label;
      el.innerHTML = '<img class="icon-svg" src="icon/' + info.file + '" alt="' + info.label + '" onerror="this.style.display=\'none\'">';
      badgeRow.appendChild(el);
    });
    card.appendChild(badgeRow);
  }

  // Subarea and Checkpoint/Custom-Node are two DIFFERENT pieces of info and
  // both get their own slot when applicable (bottom-right of the card, same
  // size as a Capture icon, stacked side by side). A moon inside a subarea
  // that ALSO has a custom_place/checkpoint tag (e.g. a moon on the Rooftop
  // custom node, which lives inside the Bullet Bill Maze subarea) shows
  // BOTH icons — previously this was an if/else-if that only ever showed
  // one, silently dropping the custom node any time the moon was also in a
  // subarea. A moon with no subarea just shows the Checkpoint/Custom-Node
  // icon as before.
  if(moon.subarea){
    const info = document.createElement("span");
    info.className = "checkpoint-info";
    info.tabIndex = 0; // keyboard-focusable, same pattern as makeIcon()
    info.setAttribute("aria-label", moon.subarea + " — click for entrance requirements");
    info.setAttribute("role", "button");

    const img = document.createElement("img");
    img.src = "icon/infosubarea.png";
    img.alt = "";
    img.onerror = function(){ this.style.display = "none"; };
    info.appendChild(img);

    const tip = document.createElement("span");
    tip.className = "icon-tooltip";
    tip.textContent = moon.subarea;
    info.appendChild(tip);

    // Clicking (or Enter/Space while focused) opens the node-inspect popup
    // listing EVERY entrance into this subarea and what each one requires —
    // a subarea can have more than one way in (e.g. Freezing Waterway's
    // near vs. far pipe), and each one can have its own cost.
    const openThisSubarea = () => openNodeInfo({ kind:"subarea", kingdom: moon.kingdom, stage: moon.subareaStage, subareaName: moon.subarea, entranceReqs: moon.entranceReqs, moonName: moon.name });
    info.addEventListener("click", openThisSubarea);
    info.addEventListener("keydown", (e) => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openThisSubarea(); } });

    card.appendChild(info);
  }
  if(moon.checkpoint && (moon.checkpointType === "custom_place" || !moon.subarea)){
    // A plain Checkpoint (checkpointType === "checkpoint") is redundant once
    // a Subarea icon is already shown — the subarea already tells you where
    // the moon is, a generic overworld checkpoint doesn't add anything for
    // a subarea moon. So it's skipped whenever moon.subarea is set. A
    // Custom Node (checkpointType === "custom_place") is NOT skipped even
    // inside a subarea — that's a specific named waypoint (e.g. Rooftop),
    // not a generic checkpoint, so it still gets shown alongside Subarea.
    // Strip a trailing "Checkpoint" word for the tooltip text per request
    // (e.g. "Stone Bridge Checkpoint" -> "Stone Bridge"), independent of
    // the "(objXXX)" suffix already stripped when the lookup was built.
    const shortName = moon.checkpoint.replace(/\s*Checkpoint\s*$/i, "");
    const label = "Tracked from: " + shortName;

    const info = document.createElement("span");
    info.className = "checkpoint-info";
    info.tabIndex = 0; // keyboard-focusable, same pattern as makeIcon()
    info.setAttribute("aria-label", label + " — click for its requirements");
    info.setAttribute("role", "button");

    const img = document.createElement("img");
    // Custom Nodes (node_type === "custom_place") get their own icon;
    // everything else (regular checkpoints, and nodes that only inherited
    // a checkpoint via BFS) keeps the normal checkpoint icon. Driven
    // entirely by checkpointType from buildCheckpointLookup — automatic
    // for every kingdom/node, present or future, no hardcoded names.
    img.src = moon.checkpointType === "custom_place" ? "icon/customnode.png" : "icon/infocheckpoint.png";
    img.alt = "";
    img.onerror = function(){ this.style.display = "none"; };
    info.appendChild(img);

    const tip = document.createElement("span");
    tip.className = "icon-tooltip";
    tip.textContent = label;
    info.appendChild(tip);

    // Clicking (or Enter/Space while focused) opens the node-inspect popup
    // showing what it actually costs to reach this checkpoint/custom node.
    const openThisCheckpoint = () => openNodeInfo({
      kind: moon.checkpointType === "custom_place" ? "custom_place" : "checkpoint",
      kingdom: moon.kingdom,
      nodeId: moon.checkpointNodeId,
      fallbackName: shortName,
    });
    info.addEventListener("click", openThisCheckpoint);
    info.addEventListener("keydown", (e) => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openThisCheckpoint(); } });

    card.appendChild(info);
  }

  // Subarea moons whose pipes differ show per-pipe rows INSTEAD of the single
  // requirement line (the rows already include the moon's own cost).
  if(moon.entranceReqs){
    const rows = renderEntranceReqs(moon.entranceReqs);
    rows.style.borderTop = "none"; rows.style.marginTop = "0"; rows.style.paddingTop = "0";
    card.appendChild(rows);
  } else {
    card.appendChild(buildMovementOptions(moon));
  }
  return card;
}

// Restarts an already-rendered chip's CSS entrance animation (clear the
// inline override, force a reflow, reapply with a fresh delay) — used when
// uncollapsing an options box so the chips that were hidden under the fade
// actually slide-and-pop in again, instead of the animation being a no-op
// because it already silently finished while clipped off-screen.
function replayChipEntrance(chip, staggerIndex){
  chip.style.animation = "none";
  void chip.offsetWidth; // force reflow so the browser "forgets" the old run
  chip.style.animationDelay = (Math.min(staggerIndex, 12) * 0.05) + "s";
  chip.style.animation = "";
}

// Measures a collapsed options box off its own real chips — the first
// chip's full height plus a peek of the second — rather than guessing a
// fixed pixel value, since chip height varies with icon/AND count and can
// wrap. Also sizes the fade overlay off that same peek so the crop always
// reads as an obvious fade-out rather than a thin sliver at the very edge.
// Safe to call while the box is hidden inside a closed moon-panel/
// checkpoint-group/node-info popup: a zero-height read just leaves it
// unmeasured so the open handlers below retry once it's actually visible.
function measureOptionsCollapsible(wrap){
  if(wrap.dataset.measured === "1") return;
  const chips = wrap.querySelectorAll(".option-chip");
  if(chips.length < 2){ wrap.dataset.measured = "1"; return; }
  const wrapTop = wrap.getBoundingClientRect().top;
  const secondRect = chips[1].getBoundingClientRect();
  if(secondRect.height === 0) return; // still hidden behind a closed ancestor
  const peek = secondRect.height * 0.55;
  const collapsedH = Math.round((secondRect.top - wrapTop) + peek);
  const fadeH = Math.round(Math.min(Math.max(peek + 22, 42), collapsedH * 0.7));
  wrap.style.setProperty("--collapsed-h", Math.max(collapsedH, 56) + "px");
  wrap.style.setProperty("--fade-h", fadeH + "px");
  wrap.dataset.measured = "1";
}
function measureOptionsCollapsiblesIn(root){
  (root || document).querySelectorAll(".options-collapsible:not([data-measured='1'])").forEach(measureOptionsCollapsible);
}

// Shared by every place that renders a .tier-stack of OR/AND requirement
// chips (a moon's own movement options, AND a subarea/checkpoint/custom-
// node's reach requirements via renderReachTierLanes) — assigns the
// staggered entrance delay to every chip in DOM order, then, if this stack
// has more than 6 total options, wraps it in the collapsible peek box with
// its fade + expand toggle. Centralizing this means the collapse behavior
// can't silently go missing from one rendering path (e.g. subarea entrance
// rows) while working on another.
function wrapOptionsIfCollapsible(stack, totalOptions, disableCollapse){
  stack.querySelectorAll(".option-chip").forEach((chip, i) => {
    chip.style.animationDelay = (Math.min(i, 12) * 0.05) + "s";
  });

  // The Node Info popup (openNodeInfo) renders a node's own reach
  // requirement in full every time, so it never needs — and must never
  // show — the peek/expand affordance: the popup is the "show me
  // everything about this node" view, and there's nothing left to expand
  // into. Callers that open from that popup pass disableCollapse=true
  // straight through renderReachTierLanes/renderEntranceReqs/
  // appendReachRequirement so the arrow is never constructed for that
  // render path, rather than being built and then hidden with CSS.
  if(disableCollapse || totalOptions <= 6) return stack;

  const wrap = document.createElement("div");
  wrap.className = "options-collapsible collapsed";
  wrap.dataset.measured = "0";
  wrap.appendChild(stack);

  const fade = document.createElement("div");
  fade.className = "options-fade";
  wrap.appendChild(fade);

  const expandBtn = document.createElement("button");
  expandBtn.type = "button";
  expandBtn.className = "options-expand-btn";
  expandBtn.setAttribute("aria-label", "Show all " + totalOptions + " options");
  expandBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  expandBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const opening = wrap.classList.contains("collapsed");
    wrap.classList.toggle("collapsed", !opening);
    wrap.classList.toggle("expanded", opening);
    expandBtn.classList.toggle("is-open", opening);
    expandBtn.setAttribute("aria-label", opening ? "Show fewer options" : "Show all " + totalOptions + " options");
    if(opening){
      // Replay the slide-down-into-pop entrance for every chip beyond the
      // peeked first two, staggered, so revealing them feels alive rather
      // than the box just snapping open on already-settled chips.
      const chips = stack.querySelectorAll(".option-chip");
      chips.forEach((chip, i) => { if(i >= 2) replayChipEntrance(chip, i - 2); });
    }
  });
  wrap.appendChild(expandBtn);

  return wrap;
}

// Builds just the movement-options portion of a moon (the "Free" tag or the
// tier-stack of OR/AND requirement chips). Shared by the moon-card grid view
// and the moon-panel body in the checkpoint-grouped view, since a moon's set
// of movement options doesn't change based on which view is showing it —
// checkpoint is one field per moon (its from_node_id), not per-branch.
function buildMovementOptions(moon, boxed){
  if(!moon.tierLanes || moon.tierLanes.length === 0){
    const row = document.createElement("div");
    row.className = "options-row";
    const free = document.createElement("span");
    free.className = "free-tag";
    free.textContent = "Free";
    free.style.cursor = "pointer";
    free.addEventListener("click", () => handleNodeClick(moon, "free", "Free", [], 1));
    attachVideoBadge(free, moon, "free", 1);
    row.appendChild(free);
    return row;
  }

  // One labeled lane per tier that actually has a route (Casual / Advanced /
  // Expert / the rare Glitched trick). Multiple routes *within* the same
  // tier still chain together with "or"; different tiers never mix in the
  // same lane, so it's always clear which routes are casual vs. which
  // require advanced or expert tech.
  const stack = document.createElement("div");
  stack.className = "tier-stack" + (boxed ? " boxed" : "");

  moon.tierLanes.forEach(lane => {
    const laneEl = document.createElement("div");
    laneEl.className = "tier-lane " + lane.tier;

    const pill = document.createElement("span");
    pill.className = "tier-pill";
    pill.textContent = lane.label;
    laneEl.appendChild(pill);

    const optsEl = document.createElement("div");
    optsEl.className = "tier-options";

    lane.groups.forEach((andGroup, i)=>{
      if(i > 0){
        const sep = document.createElement("span");
        sep.className = "or-sep " + lane.tier;
        sep.textContent = "or";
        optsEl.appendChild(sep);
      }
      // A branch can end up with no tokens after filtering out things like
      // Single Jump or "access to the kingdom you're already in" — that
      // branch is genuinely free, so say so instead of showing an empty chip.
      if(andGroup.length === 0){
        const chip = document.createElement("div");
        chip.className = "option-chip free-chip";
        chip.textContent = "Free";
        chip.addEventListener("click", () => handleNodeClick(moon, lane.tier, lane.label, andGroup, i + 1));
        attachVideoBadge(chip, moon, lane.tier, i + 1);
        const freeScenarioLabel = andGroup.scenarios ? scenarioListLabel(andGroup.scenarios) : null;
        if(freeScenarioLabel){
          const tag = document.createElement("span");
          tag.className = "scenario-tag";
          tag.textContent = freeScenarioLabel;
          chip.appendChild(tag);

          // Free + Scenario Data together needs an explainer: a branch can
          // show as "Free" (no ability/capture needed) yet still only be
          // valid in certain scenarios, which is easy to misread as "always
          // free". Hovering/focusing the chip clarifies via the standard
          // icon-tooltip pattern (wide variant, since this is a full
          // sentence rather than a short label).
          chip.tabIndex = 0;
          chip.setAttribute("aria-label", "Free — " + freeScenarioLabel);
          const explainer = document.createElement("span");
          explainer.className = "icon-tooltip wide";
          explainer.textContent = 'The "On Kingdom Complete" World Peace Settings forces Kingdoms to World Peace. In any case, access to ' + freeScenarioLabel + "marks this moon is Free.";
          chip.appendChild(explainer);
        }
        optsEl.appendChild(chip);
        return;
      }
      const chip = document.createElement("div");
      chip.className = "option-chip";
      chip.addEventListener("click", () => handleNodeClick(moon, lane.tier, lane.label, andGroup, i + 1));
      attachVideoBadge(chip, moon, lane.tier, i + 1);
      sortedTokensForDisplay(andGroup).forEach((token, j)=>{
        if(j > 0){
          const plus = document.createElement("span");
          plus.className = "and-plus";
          plus.textContent = "+";
          chip.appendChild(plus);
        }
        chip.appendChild(makeIcon(token));
      });
      // Scenario Data: this branch's own scenario restriction (option b —
      // each branch gets its own independent tag, never merged into a
      // combined sentence with sibling branches). andGroup.scenarios is
      // set by parseMoon from a routeEdge's option_scenarios field (never
      // from legacy_requirement_notes, which this file doesn't parse).
      // null/absent = unrestricted, so no chip is added.
      const scenarioLabel = andGroup.scenarios ? scenarioListLabel(andGroup.scenarios) : null;
      if(scenarioLabel){
        const tag = document.createElement("span");
        tag.className = "scenario-tag";
        tag.textContent = scenarioLabel;
        chip.appendChild(tag);
      }
      optsEl.appendChild(chip);
    });

    laneEl.appendChild(optsEl);
    stack.appendChild(laneEl);
  });

  // More than 6 reachability options gets noisy fast, so past that count
  // the box collapses to a peek: the first option shown in full, a cropped
  // slice of the second under a fade, and an expand toggle pinned to the
  // box's own top-right corner.
  const totalOptions = moon.tierLanes.reduce((sum, lane) => sum + lane.groups.length, 0);
  return wrapOptionsIfCollapsible(stack, totalOptions);
}

/* =========================================================
   CHECKPOINT-FIRST VIEW
   Groups the current kingdom's moons by their `checkpoint` field (the
   access point/checkpoint they're tracked from) instead of by moon. Each
   checkpoint becomes a collapsible group; each moon inside it becomes a
   collapsible panel showing that moon's movement options. A moon with no
   checkpoint (e.g. it only carries a subarea tag, or neither) falls into
   an "Other / No Checkpoint" bucket so nothing silently disappears. */
function groupMoonsByCheckpoint(moons){
  const groups = new Map(); // checkpoint name -> { type, moons: [] }
  const NO_CHECKPOINT = "Other / No Checkpoint";
  moons.forEach(moon => {
    const key = moon.checkpoint || NO_CHECKPOINT;
    if(!groups.has(key)) groups.set(key, { type: moon.checkpointType || null, moons: [] });
    groups.get(key).moons.push(moon);
  });
  // Alphabetical by checkpoint name, with the no-checkpoint bucket always last.
  return Array.from(groups.entries()).sort((a, b) => {
    if(a[0] === NO_CHECKPOINT) return 1;
    if(b[0] === NO_CHECKPOINT) return -1;
    return a[0].localeCompare(b[0]);
  });
}

function buildMoonPanel(moon){

  chevron.className = "moon-panel-chevron";
  chevron.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  header.appendChild(chevron);
